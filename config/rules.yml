# Validation rules from the project brief. Consumed by src/pipeline/validate.py.
schema:
  customer_id:
    dtype: int64
    nullable: false
    unique: true
    checks: {gt: 0}

  first_name:
    dtype: str
    nullable: false
    checks: {min_len: 2, max_len: 50, pattern: "^[A-Za-z][A-Za-z '\\-]*$"}

  last_name:
    dtype: str
    nullable: false
    checks: {min_len: 2, max_len: 50, pattern: "^[A-Za-z][A-Za-z '\\-]*$"}

  email:
    dtype: str
    nullable: false
    checks: {pattern: "^[^@\\s]+@[^@\\s]+\\.[A-Za-z]{2,}$"}

  phone:
    dtype: str
    nullable: false
    checks: {pattern: "^\\d{3}-\\d{3}-\\d{4}$"}

  date_of_birth:
    dtype: date
    nullable: false
    checks: {min_age: 18, max_age: 120}

  address:
    dtype: str
    nullable: false
    checks: {min_len: 10, max_len: 200}

  income:
    dtype: float64
    nullable: false
    checks: {ge: 0, le: 10000000}

  account_status:
    dtype: str
    nullable: false
    checks: {isin: [active, inactive, suspended]}

  created_date:
    dtype: date
    nullable: false
    checks: {not_future: true}

# Cross-column rules Pandera checks at dataframe level
dataframe_checks:
  - name: dob_before_created
    description: A customer cannot be created before they were born

# Remediation policy. Cleaning repairs what is unambiguous and quarantines the
# rest; nothing is dropped silently. Deliberately declared here so the policy
# can be argued about without reading Python.
remediation:
  # Variants that map to a permitted account_status with no guesswork.
  status_aliases:
    actv: active
    inactve: inactive
    susp: suspended
  # Date formats accepted on input. Tried in order; first match wins.
  date_formats:
    - "%Y-%m-%d"
    - "%Y/%m/%d"
    - "%m/%d/%Y"
    - "%d-%m-%Y"
    - "%B %d, %Y"
  # A row failing any of these cannot be repaired without inventing data.
  quarantine_reasons:
    - duplicate_customer_id
    - missing_required_field
    - unparseable_date
    - unparseable_phone
    - unparseable_income
    - income_out_of_range
    - implausible_age
    - future_created_date
    - malformed_email
    - unmappable_account_status
    - address_too_short
    - name_too_short
